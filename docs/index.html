<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WR–CB Matchup Matrix</title>
<meta name="description" content="Man-coverage decision tool for coaches: which route family to call, which corner to attack, which corner to assign, for a given down, distance and field position.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Thème avant le premier rendu (évite le flash) : choix mémorisé, sinon préférence système
  try { const th = localStorage.getItem("mm-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --page: #f3f1eb; --surface: #fcfcfb; --surface-2: #f6f5f1; --line: #e4e3df; --line-2: #d3d1cb;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #85847e;
  --band: #0d1b2a; --band-ink: #f4f2ec; --band-ink-2: #a9b4c2; --flag: #c8102e; --gold: #b8963e;
  --cut: #2a78d6; --go: #eb6834; --neutral: #ecebe7; --good: #1f8a4c;
  --shadow: 0 1px 2px rgba(13,27,42,.06), 0 4px 16px rgba(13,27,42,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2e2b; --line-2: #3a3a37;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --band: #0a1420; --band-ink: #f0efec; --band-ink-2: #8fa0b3; --flag: #e5484d; --gold: #d4b25c;
    --cut: #3987e5; --go: #d95926; --neutral: #2c2c29; --good: #3fae6c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2e2b; --line-2: #3a3a37;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
  --band: #0a1420; --band-ink: #f0efec; --band-ink-2: #8fa0b3; --flag: #e5484d; --gold: #d4b25c;
  --cut: #3987e5; --go: #d95926; --neutral: #2c2c29; --good: #3fae6c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; transition: background .25s ease;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { font-family: Oswald, "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
a { color: inherit; }

/* ---------- Top bar ---------- */
.topbar { background: linear-gradient(90deg, #0a1520 0%, var(--band) 55%, #13263b 100%); color: var(--band-ink); position: sticky; top: 0; z-index: 30;
  border-bottom: 3px solid var(--flag); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
body.is-event .topbar { background: linear-gradient(90deg, #07090d, #141a25 60%, #07090d); border-bottom-color: #b8963e; }
body.is-event nav.pages a.on { border-bottom-color: #e6c66f; color: #f3d98b; }
.topbar .wrap { display: flex; align-items: center; gap: 14px; min-height: 56px; flex-wrap: wrap; }
.brand { font: 700 18px/1 Oswald, sans-serif; text-transform: uppercase; letter-spacing: .03em; text-decoration: none; white-space: nowrap; }
.brand span { color: var(--flag); }
nav.pages { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav.pages a { font: 600 13px/1 Oswald, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--band-ink-2);
  text-decoration: none; padding: 20px 10px 17px; border-bottom: 3px solid transparent; margin-bottom: -3px; white-space: nowrap; }
nav.pages a:hover { color: var(--band-ink); }
nav.pages a.on { color: var(--band-ink); border-bottom-color: var(--band-ink); }
.toggles { display: flex; gap: 6px; }
.tg { font: 600 12px/1 Inter, sans-serif; color: var(--band-ink); background: transparent; border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px; padding: 7px 11px; cursor: pointer; min-height: 32px; }
.tg:hover { border-color: rgba(255,255,255,.6); }
.tg b { color: var(--band-ink); } .tg span { color: var(--band-ink-2); }

/* ---------- Page scaffolding ---------- */
.page { display: none; padding: 26px 0 40px; }
.page.on { display: block; }
.ph { margin-bottom: 16px; }
.ph { position: relative; padding: 22px 24px 20px; border-radius: 16px; margin-bottom: 18px; overflow: hidden;
  background: linear-gradient(120deg, color-mix(in oklab, var(--band) 92%, transparent), color-mix(in oklab, var(--band) 75%, var(--cut) 25%)); color: var(--band-ink); }
.ph::before { content: ""; position: absolute; inset: 0; opacity: .08; pointer-events: none; background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 56px); }
.ph::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--flag); }
.ph > * { position: relative; }
.ph .eyebrow { color: var(--band-ink-2); }
.ph p { color: var(--band-ink-2) !important; }
.ph h1 { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.02; margin: 4px 0 6px; font-weight: 700; }
.ph p { color: var(--ink-2); margin: 0; max-width: 860px; }
.eyebrow { font: 600 12px/1.2 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.rk, .board td, .ev-key, .dot { transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; }
.rk:hover { transform: translateX(2px); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 200px; max-width: 320px; }
.field.sm { flex: 0 1 130px; }
.field label { font: 600 11px/1 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
select, button.btn { font: 500 15px Inter, sans-serif; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 8px 10px; min-height: 40px; }
select { width: 100%; }
button.btn { cursor: pointer; font-weight: 600; }
button.btn:hover { border-color: var(--ink-3); }
select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--cut); outline-offset: 2px; }

/* ---------- Situation bar ---------- */
.situation { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 12px 14px; margin-bottom: 16px; }
.situation .tag { font: 700 13px/1 Oswald, sans-serif; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--surface);
  border-radius: 6px; padding: 8px 10px; align-self: center; }
.situation .sum { margin-left: auto; align-self: center; font-size: 13px; color: var(--ink-2); max-width: 320px; }
.situation .sum b { color: var(--ink); }

/* ---------- Home ---------- */
.hero { background: var(--band); color: var(--band-ink); border-radius: 14px; padding: 26px 24px; position: relative; overflow: hidden; margin-bottom: 16px; }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .07; pointer-events: none;
  background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 64px); }
.hero > * { position: relative; }
.hero .eyebrow { color: var(--band-ink-2); }
.hero h1 { font-size: clamp(30px, 5vw, 54px); margin: 8px 0; line-height: 1; }
.hero h1 .no { color: var(--gold); } .hero h1 .pit { color: #ffb612; }
.hero p { color: var(--band-ink-2); margin: 0; max-width: 820px; }
.hero p b { color: var(--band-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--band-ink); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.side { padding: 18px; }
.side h2 { font-size: 22px; margin: 0 0 2px; }
.side .sub { color: var(--ink-2); font-size: 13.5px; margin: 0 0 12px; }
.wr-block { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.wr-block:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.wr-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.wr-head b { font: 700 18px Oswald, sans-serif; text-transform: uppercase; }
.wr-head span { color: var(--ink-3); font-size: 12.5px; }
.small-note { font-size: 12px; color: var(--ink-3); margin-top: 12px; }

/* ---------- Event page : NFL Paris Game (noir & or, nuit au Stade de France) ---------- */
body.is-event { background: #07090d; }
body.is-event footer { color: #8c8572; }
.event { --surface: #0f131b; --surface-2: #161b25; --ink: #f3efe6; --ink-2: #c9c2b0; --ink-3: #8c8572; --line: #262c38; --line-2: #3a4150;
  --good: #d3bc8d; --neutral: #232a36; --shadow: 0 10px 40px rgba(0,0,0,.45); color: var(--ink); padding-top: 18px; }
.event .card { border-color: rgba(211,188,141,.18); }
.ev-hero { position: relative; overflow: hidden; border-radius: 18px; padding: 34px 28px 44px; margin-bottom: 26px; min-height: 360px;
  background:
    radial-gradient(60% 55% at 12% -10%, rgba(255,236,170,.30), transparent 60%),
    radial-gradient(55% 50% at 88% -12%, rgba(255,236,170,.26), transparent 60%),
    radial-gradient(90% 70% at 50% 120%, rgba(211,188,141,.18), transparent 70%),
    linear-gradient(180deg, #0c111b 0%, #07090d 100%);
  border: 1px solid rgba(211,188,141,.28); box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,236,170,.12); }
.ev-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 72px); }
.ev-hero::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -60px; height: 140px; pointer-events: none;
  background: radial-gradient(50% 100% at 50% 100%, rgba(47,107,52,.55), transparent 70%); }
.ev-eiffel { position: absolute; right: 3%; bottom: 0; height: 92%; opacity: .22; filter: drop-shadow(0 0 18px rgba(243,217,139,.35)); }
.ev-inner { position: relative; z-index: 1; }
.ev-ticket { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid rgba(211,188,141,.45); border-radius: 8px; overflow: hidden;
  font: 600 12px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #e9d9ae; }
.ev-ticket span { padding: 9px 12px; border-right: 1px dashed rgba(211,188,141,.45); }
.ev-ticket span:first-child { background: linear-gradient(135deg, #f3d98b, #b8963e); color: #0a0c11; font-weight: 700; }
.ev-ticket span:last-child { border-right: 0; }
.ev-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin: 26px 0 18px; max-width: 900px; }
.ev-team { display: flex; flex-direction: column; gap: 4px; }
.ev-team.pit { align-items: flex-end; text-align: right; }
.ev-abbr { font: 700 clamp(64px, 11vw, 132px)/.85 Oswald, sans-serif; letter-spacing: .02em;
  background: linear-gradient(180deg, #fff6d8 0%, #e6c66f 45%, #9b7a2c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(243,217,139,.18); }
.ev-team.pit .ev-abbr { background: linear-gradient(180deg, #fff3c4 0%, #ffb612 50%, #b37a00 100%); -webkit-background-clip: text; background-clip: text; }
.ev-name { font: 600 clamp(15px, 2vw, 20px)/1.1 Oswald, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: #f3efe6; }
.ev-name b { color: #e6c66f; } .ev-team.pit .ev-name b { color: #ffb612; }
.ev-tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8c8572; }
.ev-vs { text-align: center; }
.ev-vs-txt { font: 700 22px/1 Oswald, sans-serif; letter-spacing: .2em; color: #e9d9ae; margin-top: 10px; }
.ev-count { display: inline-block; font: 700 15px/1 Oswald, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #0a0c11;
  background: linear-gradient(135deg, #f3d98b, #b8963e); padding: 9px 14px; border-radius: 999px; box-shadow: 0 0 24px rgba(243,217,139,.35); }
.ev-lede { max-width: 640px; color: #c9c2b0; margin: 0; font-size: 15.5px; }
.ev-lede b { color: #f3efe6; }
.ev-tricolor { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: flex; z-index: 1; }
.ev-tricolor i { flex: 1; } .ev-tricolor i:nth-child(1) { background: #0055a4; } .ev-tricolor i:nth-child(2) { background: #fff; } .ev-tricolor i:nth-child(3) { background: #ef4135; }
.ev-h2 { font: 700 22px/1 Oswald, sans-serif; letter-spacing: .12em; color: #e9d9ae; margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
.ev-h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(211,188,141,.5), transparent); }
.ev-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.ev-key { position: relative; padding: 16px 16px 14px; border-radius: 12px; background: linear-gradient(160deg, #141a25, #0c1017);
  border: 1px solid rgba(211,188,141,.22); cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
.ev-key:hover { transform: translateY(-2px); border-color: rgba(243,217,139,.6); }
.ev-key .kn { font: 700 40px/1 Oswald, sans-serif; color: rgba(211,188,141,.22); position: absolute; right: 12px; top: 8px; }
.ev-key .kt { font: 600 11px/1.2 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #e6c66f; }
.ev-key.pit .kt { color: #ffb612; }
.ev-key .kh { font: 700 19px/1.15 Oswald, sans-serif; text-transform: uppercase; margin: 8px 0 6px; color: #f3efe6; }
.ev-key .kb { font-size: 13px; color: #c9c2b0; }
.ev-key .kb b { color: #f3efe6; }
.ev-side { position: relative; overflow: hidden; }
.ev-side::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, #e6c66f, #9b7a2c); }
.ev-side.pit::before { background: linear-gradient(90deg, #ffb612, #b37a00); }
.ev-side h2 { color: #f3efe6; }
.event .situation .tag { background: linear-gradient(135deg, #f3d98b, #b8963e); color: #0a0c11; }
.event select { background: #161b25; color: #f3efe6; border-color: #3a4150; }
.event .pill.cut { background: #2a78d6; } .event .pill.go { background: #eb6834; }

/* ---------- Ranked decision lists ---------- */
.rank { display: flex; flex-direction: column; gap: 6px; }
.rk { display: grid; grid-template-columns: 22px minmax(0, 1.25fr) 96px minmax(0, 1fr) 54px; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 8px; background: var(--surface-2); cursor: pointer; border: 1px solid transparent; }
.rk:hover { border-color: var(--line-2); }
.rk.best { background: color-mix(in oklab, var(--good) 12%, var(--surface)); border-color: color-mix(in oklab, var(--good) 45%, var(--surface)); }
.rk .n { font: 700 14px Oswald, sans-serif; color: var(--ink-3); }
.rk .who { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk .who small { color: var(--ink-3); font-weight: 500; }
.pill { font: 700 12px/1 Oswald, sans-serif; letter-spacing: .04em; text-align: center; padding: 6px 4px; border-radius: 5px; color: #fff; white-space: nowrap; }
.pill.cut { background: var(--cut); } .pill.go { background: var(--go); }
.meter { height: 8px; background: var(--neutral); border-radius: 4px; position: relative; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink); }
.rk .val { font: 700 15px Oswald, sans-serif; text-align: right; }
.rk-cap { display: grid; grid-template-columns: 22px minmax(0, 1.25fr) 96px minmax(0, 1fr) 54px; gap: 10px; font-size: 10.5px;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 0 10px 4px; }

/* ---------- Lab ---------- */
.lab { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 16px; align-items: stretch; }
.player { overflow: hidden; display: flex; flex-direction: column; }
.p-top { display: flex; gap: 14px; align-items: center; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.jersey { font: 700 32px/1 Oswald, sans-serif; width: 62px; height: 62px; flex: none; display: grid; place-items: center;
  border-radius: 10px; background: var(--band); color: var(--band-ink); }
.p-name { font: 700 23px/1.05 Oswald, sans-serif; text-transform: uppercase; margin: 0; }
.p-meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.p-pos { font-weight: 700; color: var(--ink); }
.forty { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 6px; margin-right: 6px; font-size: 12px; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.forty b { font: 700 15px Oswald, sans-serif; color: var(--ink); }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 Inter, sans-serif; letter-spacing: .06em;
  text-transform: uppercase; padding: 6px 10px; border-radius: 999px; margin-top: 6px; }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.limited { font-size: 11px; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 999px; padding: 3px 8px; margin-left: 4px; }
.p-body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.trait-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.trait-label b { font: 600 13px Oswald, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
.trait-label span { color: var(--ink-2); text-align: right; }
.bar { position: relative; height: 10px; background: var(--neutral); border-radius: 5px; }
.bar > div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width .35s ease; }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; left: 50%; background: var(--surface); }
.trait-foot { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
.pct { font: 700 20px/1 Oswald, sans-serif; color: var(--ink); white-space: nowrap; }
.pct small { font-size: 11px; color: var(--ink-3); }
.scout-note { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin: 0; }
.scout-note b { color: var(--ink); }
.mini-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }
.mini-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.turf { border-radius: 8px; overflow: hidden; margin-top: 6px; }

.verdict { padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px; border-top: 6px solid var(--cut); }
.verdict.go { border-top-color: var(--go); }
.v-call { font: 700 clamp(30px, 4vw, 42px)/1 Oswald, sans-serif; text-transform: uppercase; margin: 2px 0 0; color: var(--cut); }
.verdict.go .v-call { color: var(--go); }
.v-routes { color: var(--ink-2); font-size: 14px; margin: 2px 0 0; }
.split { display: flex; height: 34px; border-radius: 8px; overflow: hidden; font: 700 14px/34px Oswald, sans-serif; letter-spacing: .04em; }
.split div { color: #fff; padding: 0 10px; white-space: nowrap; transition: width .35s ease; min-width: 0; overflow: hidden; }
.split .c { background: var(--cut); } .split .g { background: var(--go); text-align: right; }
.split-cap { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.cmp th, .cmp td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; color: var(--ink-2); font-weight: 500; }
.cmp thead th { font: 600 12px Oswald, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.cmp thead th.c { color: var(--cut); } .cmp thead th.g { color: var(--go); }
.cmp td.win { font-weight: 700; color: var(--ink); }
.cmp tr.obj td { background: var(--surface-2); }
.cmp tr.obj td:first-child { color: var(--ink); font-weight: 700; }

/* ---------- Board ---------- */
.board-wrap { overflow-x: auto; padding: 14px; }
table.board { border-collapse: separate; border-spacing: 3px; margin: 0 auto; }
.board th { font: 500 12px/1.2 Inter, sans-serif; color: var(--ink-2); white-space: nowrap; }
.board thead th { vertical-align: bottom; padding: 0 0 6px; font-weight: 600; color: var(--ink); }
.board tbody th { text-align: right; padding-right: 8px; font-weight: 600; color: var(--ink); }
.board th small { color: var(--ink-3); font-weight: 500; }

let LANG = store.get("mm-lang") || ((navigator.language || "en").startsWith("fr") ? "fr" : "en");
const t = (k, vars) => { let s = I18N[LANG][k] ?? I18N.en[k] ?? k; if (vars && typeof s === "string") for (const [a, b] of Object.entries(vars)) s = s.replaceAll("{" + a + "}", b); return s; };
const num = (v, d = 1) => (LANG === "fr" ? v.toFixed(d).replace(".", ",") : v.toFixed(d));
const pct = v => Math.round(v * 100) + (LANG === "fr" ? " %" : "%");
const sgn = (v, d = 2) => (v >= 0 ? "+" : "−") + num(Math.abs(v), d);
const ord = n => LANG === "fr" ? (n === 1 ? "er" : "e") : ([11, 12, 13].includes(n % 100) ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));

// ======================= Decision engine =======================
// Gauss–Hermite (N(0,1)) : probabilité logistique moyennée sur le bruit d'une répétition à l'autre
const GH = [[-2.8570, 0.01126], [-1.3556, 0.22208], [0, 0.53333], [1.3556, 0.22208], [2.8570, 0.01126]];
const FAM = { cut: { m: "burst", c: CMP.cut, s: SIT.cut, k: "cut" }, go: { m: "burn", c: CMP.vertical, s: SIT.vertical, k: "vertical" } };
const sigm = z => 1 / (1 + Math.exp(-z));
function pComplete(fam, metric, b) {  // b = tirage bootstrap (modèle de complétion réajusté), undefined = estimation
  const F = FAM[fam], sd = FIT[F.m].route_sd, [b0, b1] = b === undefined ? [F.c.b0, F.c.b1] : SIT.draws.completion[F.k][b];
  return GH.reduce((acc, [z, w]) => acc + w * sigm(b0 + b1 * (metric + sd * z)), 0);
}
const state = { down: 3, togo: 7, toGoal: 50, objective: "auto", wr: null, cb: null, off: "NO", def: "PIT" };
const objectiveKey = () => state.objective !== "auto" ? state.objective : (state.down >= 3 ? "conv" : "yds");
// Yards par famille (ligue, man) : P(gain ≥ yards à gagner | complétée) et E[min(gain, distance à l'en-but)]
function yardStatsOf(ys) {
  const need = Math.min(state.togo, state.toGoal);
  return { conv: ys.filter(y => y >= need).length / ys.length, eyds: ys.reduce((a, y) => a + Math.min(y, state.toGoal), 0) / ys.length };
}
const ysCache = {};  // par situation : estimation + chaque tirage bootstrap (yards rééchantillonnés)
function yardTable() {
  const k = state.togo + "|" + state.toGoal;
  if (!ysCache[k]) ysCache[k] = {
    est: { cut: yardStatsOf(SIT.cut.yards), go: yardStatsOf(SIT.vertical.yards) },
    draws: Array.from({ length: B }, (_, b) => ({ cut: yardStatsOf(SIT.draws.yards.cut[b]), go: yardStatsOf(SIT.draws.yards.vertical[b]) }))
  };
  return ysCache[k];
}
function outcome(fam, metric, ys, b) { const p = pComplete(fam, metric, b); return { cmp: p, conv: p * ys.conv, yds: p * ys.eyds }; }
const mu = { cut: FIT.burst.mu, go: FIT.burn.mu };
function drawVal(w, c, b, key) {  // valeur de l'objectif pour chaque appel, tirage bootstrap b (profils + modèles de résultat)
  const ys = yardTable().draws[b];
  return { cut: outcome("cut", mu.cut + w.draws.burst[b] + c.draws.burst[b], ys.cut, b)[key],
           go: outcome("go", mu.go + w.draws.burn[b] + c.draws.burn[b], ys.go, b)[key] };
}
function evaluate(w, c) {
  const ys = yardTable().est, key = objectiveKey();
  const mC = mu.cut + w.burst + c.burst, mG = mu.go + w.burn + c.burn;
  const res = { cut: outcome("cut", mC, ys.cut), go: outcome("go", mG, ys.go), mC, mG, key };
  let cutWins = 0;
  for (let b = 0; b < B; b++) { const v = drawVal(w, c, b, key); if (v.cut > v.go) cutWins++; }
  res.shareCut = cutWins / B;
  res.call = res.cut[key] >= res.go[key] ? "cut" : "go";
  res.best = res[res.call][key];
  const conf = Math.max(res.shareCut, 1 - res.shareCut);
  res.conf = conf >= 0.9 ? 3 : conf >= 0.75 ? 2 : conf >= 0.6 ? 1 : 0;
  return res;
}
// % de simulations où chaque corner est le meilleur choix (max pour l'attaque, min pour la défense)
function pickRates(w, cbs, maximize) {
  const key = objectiveKey(), wins = new Array(cbs.length).fill(0);
  for (let b = 0; b < B; b++) {
    let bi = 0, bv = maximize ? -Infinity : Infinity;
    cbs.forEach((c, i) => { const v = drawVal(w, c, b, key), best = Math.max(v.cut, v.go); if (maximize ? best > bv : best < bv) { bv = best; bi = i; } });
    wins[bi]++;
  }
  return wins.map(x => x / B);
}
const fmtObj = (key, v) => key === "yds" ? num(v, 1) + " yd" : pct(v);
const objLabel = key => t({ cmp: "obj_cmp", conv: "obj_conv", yds: "obj_yds" }[key]);

// ======================= Route tree on a football field =======================
function routeTree(w) {
  const P = D.paths[String(w.nflId)] || {};
  const W = 320, H = 250, s = 6.4, sl = 9.5, cx = W / 2, baseY = H - 24;  // latéral ×1,5 pour la lisibilité
  const X = l => cx + l * sl, Y = d => baseY - d * s;
  let g = `<rect width="${W}" height="${H}" fill="#2f6b34"/>`;
  for (let d = -5; d < 35; d += 5) g += `<rect x="0" y="${Y(d + 5)}" width="${W}" height="${5 * s}" fill="${Math.abs(d / 5) % 2 ? "#357a3b" : "#2f6b34"}"/>`;
  for (let d = -3; d <= 34; d++) {  // repères de hash et de bord, chaque yard
    if (d % 5 === 0) continue;
    for (const [a, b] of [[cx - 28, cx - 22], [cx + 22, cx + 28], [4, 10], [W - 10, W - 4]])
      g += `<line x1="${a}" x2="${b}" y1="${Y(d)}" y2="${Y(d)}" stroke="#fff" stroke-opacity=".55"/>`;
  }
  for (let d = 5; d <= 30; d += 5) {
    g += `<line x1="0" x2="${W}" y1="${Y(d)}" y2="${Y(d)}" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>`;
    g += `<text x="18" y="${Y(d) + 4}" font-size="11" font-weight="700" fill="#fff" fill-opacity=".85">${d}</text><text x="${W - 18}" y="${Y(d) + 4}" font-size="11" font-weight="700" fill="#fff" fill-opacity=".85" text-anchor="end">${d}</text>`;
  }
  g += `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4aa3ff" stroke-width="3"/>`;  // ligne de mêlée
  if (state.togo <= 30) g += `<line x1="0" x2="${W}" y1="${Y(state.togo)}" y2="${Y(state.togo)}" stroke="#ffd400" stroke-width="3"/>`;  // ligne à atteindre
  for (const [fam, color] of [["vertical", "#ffb27a"], ["cut", "#8ec5ff"]]) {
    for (const path of P[fam] || []) {
      const pts = path.filter(([l, d]) => Math.abs(l) < 16 && d > -4 && d < 36).map(([l, d]) => `${X(l).toFixed(1)},${Y(d).toFixed(1)}`).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="#0b2e10" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
      g += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }
  g += `<text x="${W - 8}" y="${H - 7}" font-size="10" fill="#fff" fill-opacity=".9" text-anchor="end">${t("outside")}</text><text x="8" y="${H - 7}" font-size="10" fill="#fff" fill-opacity=".9">${t("inside")}</text>`;
  return `<div class="turf"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("tree"))} ${esc(w.name)}">${g}</svg></div>`;
}

// ======================= Verdict =======================
function renderVerdict(w, c) {
  const r = evaluate(w, c), go = r.call === "go", key = r.key, v = $("verdict");
  v.className = "card verdict" + (go ? " go" : "");
  const cutW = Math.round(r.shareCut * 100), goW = 100 - cutW, pc = n => n + (LANG === "fr" ? " %" : "%");
  const cell = (k, fam, f) => `<td class="${r[fam][k] >= r[fam === "cut" ? "go" : "cut"][k] ? "win" : ""}">${f(r[fam][k])}</td>`;
  const row = (k, label, f) => `<tr class="${k === key ? "obj" : ""}"><td>${label}</td>${cell(k, "cut", f)}${cell(k, "go", f)}</tr>`;
  v.innerHTML = `<div><div class="eyebrow">${t("the_call")}</div><p class="v-call">${go ? t("call_go") : t("call_cut")}</p><p class="v-routes">${go ? t("routes_go") : t("routes_cut")}</p></div>
    <div><div class="split"><div class="c" style="width:${cutW}%;padding:${cutW ? "0 10px" : "0"}">${cutW >= 14 ? "CUT " + pc(cutW) : ""}</div><div class="g" style="width:${goW}%;padding:${goW ? "0 10px" : "0"}">${goW >= 14 ? "GO " + pc(goW) : ""}</div></div>
      <div class="split-cap">${t("split_cap", { b: B })} · <b>${t("conf")[r.conf]}</b></div></div>
    <table class="cmp"><thead><tr><th></th><th class="c">${t("col_cut")}</th><th class="g">${t("col_go")}</th></tr></thead><tbody>
      ${row("cmp", t("row_cmp"), x => pct(x))}${row("conv", t("row_conv"), x => pct(x))}${row("yds", t("row_yds"), x => num(x, 1))}
      <tr><td>${t("row_int")}</td><td>${pct(SIT.cut.int_rate)}</td><td>${pct(SIT.vertical.int_rate)}</td></tr>
      <tr><td>${t("row_metric")}</td><td>${sgn(r.mC)}</td><td>${num(r.mG, 2)}</td></tr>
    </tbody></table>
    <p class="scout-note">${t(go ? "why_go" : "why_cut", { w: esc(w.name), c: esc(c.name), p: Math.round((go ? 1 - r.shareCut : r.shareCut) * 100) })}</p>`;
}

// ======================= Ranked lists (home + game plan) =======================
function rankList(items, capTarget) {
  return `<div class="rk-cap"><span>#</span><span>${capTarget}</span><span>${t("cap_call")}</span><span class="mcol">${t("cap_best_long")}</span><span></span></div>
    <div class="rank">${items.map((x, i) => `<div class="rk ${i === 0 ? "best" : ""}" data-w="${x.w.nflId}" data-c="${x.c.nflId}" role="button" tabindex="0">
      <span class="n">${i + 1}</span><span class="who">${esc(x.c.name)} <small>${esc(x.c.team)}${x.c.tier === "limited" ? " · " + t("limited") : ""}</small></span>
      <span class="pill ${x.call}">${x.call === "cut" ? "CUT" : "GO"} · ${fmtObj(x.key, x.val)}</span>
      <span class="meter"><i style="width:${Math.round(x.rate * 100)}%;${i === 0 ? "background:var(--good)" : ""}"></i></span><span class="val">${pct(x.rate)}</span></div>`).join("")}</div>`;
}
function rankItems(w, cbs, maximize) {  // attaque : corner à viser (max) ; défense : corner à affecter (min)
  const rates = pickRates(w, cbs, maximize);
  return cbs.map((c, i) => { const r = evaluate(w, c); return { w, c, call: r.call, val: r.best, key: r.key, rate: rates[i] }; })
    .sort((a, b) => maximize ? b.val - a.val : a.val - b.val);
}
function renderHome() {
  const side = (offTeam, defTeam, title) => {
    const ws = WR.filter(p => p.team === offTeam), cs = CB.filter(p => p.team === defTeam), name = defTeam === "PIT" ? "Steelers" : "Saints";
    let h = `<h2>${title}</h2><p class="sub">${t("vs_corners", { t: name })} · ${objLabel(objectiveKey())}</p>`;
    for (const w of ws) {
      h += `<div class="wr-block"><div class="wr-head"><b>${esc(w.name)}</b><span>WR · ${esc(w.team)} · ${esc(t("arch")[w.archetype])}${w.forty ? " · " + t("forty") + " " + num(w.forty, 2) + " s" : ""}${w.tier === "limited" ? " · " + t("limited") : ""}</span></div>
        <div class="eyebrow" style="margin:6px 0">${t("attack_with")}</div>${rankList(rankItems(w, cs, true), t("cap_target"))}
        <div class="eyebrow" style="margin:14px 0 6px">${t("assign_title", { t: name })}</div>${rankList(rankItems(w, cs, false), t("cap_assign"))}</div>`;
    }
    return h;
  };
  $("homeNO").innerHTML = side("NO", "PIT", t("no_off"));
  $("homePIT").innerHTML = side("PIT", "NO", t("pit_off"));
  // Compte à rebours (jours calendaires jusqu'au dimanche 25 octobre 2026)
  const now = new Date(), kick = new Date(2026, 9, 25), days = Math.round((kick - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  $("evCount").textContent = days > 1 ? t("ev_days", { n: days }) : days === 1 ? t("ev_day1") : days === 0 ? t("ev_today") : t("ev_past");
  // Les clés du match : meilleure cible pour chaque attaque, meilleure affectation pour chaque défense
  const keys = [];
  for (const [off, def, offName, defName] of [["NO", "PIT", "Saints", "Steelers"], ["PIT", "NO", "Steelers", "Saints"]]) {
    const w = WR.filter(p => p.team === off)[0], cs = CB.filter(p => p.team === def);
    if (!w || !cs.length) continue;
    const a = rankItems(w, cs, true)[0], d = rankItems(w, cs, false)[0];
    keys.push({ team: off.toLowerCase(), kt: t("key_off", { t: offName }), kh: t("key_attack", { c: a.c.name }), w, c: a.c,
      kb: t("key_attack_b", { w: esc(w.name), call: a.call === "cut" ? "CUT" : "GO", v: fmtObj(a.key, a.val) + " " + objLabel(a.key).toLowerCase(), r: pct(a.rate) }) });
    keys.push({ team: def.toLowerCase(), kt: t("key_def", { t: defName }), kh: t("key_assign", { c: d.c.name, w: w.name }), w, c: d.c,
      kb: t("key_assign_b", { w: esc(w.name), v: fmtObj(d.key, d.val), r: pct(d.rate) }) });
  }
  $("evKeys").innerHTML = keys.map((k, i) => `<div class="ev-key ${k.team}" data-w="${k.w.nflId}" data-c="${k.c.nflId}" role="button" tabindex="0">
    <span class="kn">${i + 1}</span><div class="kt">${k.kt}</div><div class="kh">${esc(k.kh)}</div><div class="kb">${k.kb}</div></div>`).join("");
}

// ======================= Game plan board =======================
function cellColor(diff) {
  const k = Math.min(Math.abs(diff) / 0.12, 1);
  return `color-mix(in oklab, ${diff >= 0 ? css("--cut") : css("--go")} ${Math.round(k * 70)}%, ${css("--neutral")})`;
}
function renderPlan() {
  const ws = WR.filter(p => state.off === "ALL" || p.team === state.off), cs = CB.filter(p => state.def === "ALL" || p.team === state.def);
  if (!ws.length || !cs.length) { $("boardWrap").innerHTML = `<div class="empty">${t("no_players")}</div>`; $("attackList").innerHTML = $("assignList").innerHTML = ""; return; }
  const key = objectiveKey();
  let h = `<table class="board"><thead><tr><th></th>${cs.map(c => `<th scope="col">${esc(c.name)}<br><small>${esc(c.team)}${c.tier === "limited" ? " · " + t("limited") : ""}</small></th>`).join("")}</tr></thead><tbody>`;
  for (const w of ws) {
    const evals = cs.map(c => evaluate(w, c)), bestIdx = evals.reduce((bi, r, i) => r.best > evals[bi].best ? i : bi, 0);
    h += `<tr><th scope="row">${esc(w.name)} <small>${esc(w.team)}</small></th>`;
    evals.forEach((r, i) => {
      const diff = r.cut[key] - r.go[key], scaled = key === "yds" ? diff / 25 : diff;
      h += `<td data-w="${w.nflId}" data-c="${cs[i].nflId}" class="${i === bestIdx && cs.length > 1 ? "pick" : ""}" style="background:${cellColor(scaled)}"><b>${r.call === "cut" ? "CUT" : "GO"}</b><span>${fmtObj(key, r.best)} · ${pct(Math.max(r.shareCut, 1 - r.shareCut))}</span></td>`;
    });
    h += "</tr>";
  }
  $("boardWrap").innerHTML = h + "</tbody></table>";
  const top = ws.slice(0, 6);
  const block = (w, maximize) => `<div class="wr-block"><div class="wr-head"><b>${esc(w.name)}</b><span>${esc(w.team)} · ${esc(t("arch")[w.archetype])}</span></div>${rankList(rankItems(w, cs, maximize).slice(0, 5), t(maximize ? "cap_target" : "cap_assign"))}</div>`;
  $("attackList").innerHTML = top.map(w => block(w, true)).join("");
  $("assignList").innerHTML = top.map(w => block(w, false)).join("");
}
function fillTeams() {
  const teamsOff = [...new Set(WR.map(p => p.team))].sort(), teamsDef = [...new Set(CB.map(p => p.team))].sort();
  $("selOff").innerHTML = teamsOff.map(x => `<option>${x}</option>`).join("") + `<option value="ALL">${t("all")} (${WR.length})</option>`;
  $("selDef").innerHTML = teamsDef.map(x => `<option>${x}</option>`).join("") + `<option value="ALL">${t("all")} (${CB.length})</option>`;
  $("selOff").value = state.off; $("selDef").value = state.def;
}
$("selOff").addEventListener("change", e => { state.off = e.target.value; renderPlan(); });
$("selDef").addEventListener("change", e => { state.def = e.target.value; renderPlan(); });

// ======================= Lab =======================
function fillPlayers() {
  const opt = arr => [...new Set(arr.map(p => p.team))].map(tm => `<optgroup label="${tm}">${arr.filter(p => p.team === tm)
    .map(p => `<option value="${p.nflId}">${esc(p.name)}${p.tier === "limited" ? " · " + t("limited") : ""}</option>`).join("")}</optgroup>`).join("");
  $("selWR").innerHTML = opt(WR); $("selCB").innerHTML = opt(CB);
}
function renderLab() {
  const w = byId(WR, state.wr), c = byId(CB, state.cb);
  $("selWR").value = w.nflId; $("selCB").value = c.nflId;
  renderWR(w); renderCB(c); renderVerdict(w, c);
}
$("selWR").addEventListener("change", e => { state.wr = +e.target.value; renderLab(); renderScatters(); });
$("selCB").addEventListener("change", e => { state.cb = +e.target.value; renderLab(); renderScatters(); });
$("btnSwap").addEventListener("click", () => { state.wr = WR[Math.floor(Math.random() * WR.length)].nflId; state.cb = CB[Math.floor(Math.random() * CB.length)].nflId; renderLab(); renderScatters(); });
function openLab(wId, cId) { state.wr = wId; state.cb = cId; renderLab(); renderScatters(); location.hash = "#lab"; scrollTo(0, 0); }
document.addEventListener("click", e => { const el = e.target.closest(".rk, .board td, .ev-key"); if (el && el.dataset.w) openLab(+el.dataset.w, +el.dataset.c); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.w) openLab(+e.target.dataset.w, +e.target.dataset.c); });

// ======================= Scatter plots =======================
function scatter(el, arr, sel, isWR) {
  const W = 560, H = 460, pad = { l: 44, r: 16, t: 14, b: 40 };
  const lim = Math.max(2.5, ...arr.map(p => Math.max(Math.abs(p.z_burst), Math.abs(p.z_burn)))) * 1.22;
  const X = v => pad.l + (v + lim) / (2 * lim) * (W - pad.l - pad.r), Y = v => pad.t + (lim - v) / (2 * lim) * (H - pad.t - pad.b);
  const corners = t(isWR ? "q_wr" : "q_cb");
  let g = `<rect x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="none" stroke="var(--line)"/>`;
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--line-2)"/><line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)"/>`;
  const cp = [[pad.l + 8, pad.t + 16, "start"], [W - pad.r - 8, pad.t + 16, "end"], [pad.l + 8, H - pad.b - 8, "start"], [W - pad.r - 8, H - pad.b - 8, "end"]];
  cp.forEach(([x, y, a], i) => g += `<text x="${x}" y="${y}" text-anchor="${a}" font-size="11" font-weight="600" letter-spacing=".06em" fill="var(--ink-3)">${corners[i]}</text>`);
  for (let v = -3; v <= 3; v++) {
    if (Math.abs(v) >= lim) continue;
    g += `<text x="${X(v)}" y="${H - pad.b + 16}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${v}</text><text x="${pad.l - 8}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--ink-3)">${v}</text>`;
  }
  g += `<text x="${(pad.l + W - pad.r) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${t(isWR ? "ax_wr_x" : "ax_cb_x")}</text>`;
  g += `<text transform="translate(12 ${(pad.t + H - pad.b) / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink-2)">${t(isWR ? "ax_wr_y" : "ax_cb_y")}</text>`;
  const top = new Set(arr.filter(p => p.tier === "profiled").sort((a, b) => (b.z_burst ** 2 + b.z_burn ** 2) - (a.z_burst ** 2 + a.z_burn ** 2)).slice(0, 7).map(p => p.nflId));
  const placed = cp.map(([x, y, a]) => a === "start" ? [x, y - 12, x + 190, y + 3] : [x - 190, y - 12, x, y + 3]);
  let dots = "", labels = "";
  for (const p of arr.slice().sort((a, b) => (b.nflId === sel) - (a.nflId === sel))) {
    const isSel = p.nflId === sel, color = p.z_burst - p.z_burn >= 0 ? "var(--cut)" : "var(--go)", cx = X(p.z_burn), cy = Y(p.z_burst), hollow = p.tier === "limited" && !isSel;
    dots += `<circle class="dot" data-id="${p.nflId}" cx="${cx}" cy="${cy}" r="${isSel ? 8 : 5.5}" fill="${hollow ? "var(--surface)" : color}" stroke="${isSel ? "var(--ink)" : hollow ? color : "var(--surface)"}" stroke-width="${isSel ? 2.5 : 1.5}"/>`;
    if (!(isSel || top.has(p.nflId))) continue;
    const right = cx < W - 140, wTxt = p.name.length * (isSel ? 7.4 : 6.3);
    const box = yy => right ? [cx + 9, yy - 11, cx + 9 + wTxt, yy + 3] : [cx - 9 - wTxt, yy - 11, cx - 9, yy + 3];
    const hit = bx => placed.some(q => bx[0] < q[2] && bx[2] > q[0] && bx[1] < q[3] && bx[3] > q[1]);
    let y = cy - 8;
    for (let k = 1; k < 7 && hit(box(y)); k++) y = cy - 8 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 14;
    placed.push(box(y));
    labels += `<text x="${right ? cx + 9 : cx - 9}" y="${y}" text-anchor="${right ? "start" : "end"}" font-size="${isSel ? 12.5 : 11}" font-weight="${isSel ? 700 : 500}" fill="var(--ink)" stroke="var(--surface)" stroke-width="3" paint-order="stroke" pointer-events="none">${esc(p.name)}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t(isWR ? "sc_wr" : "sc_cb"))}">${g}${dots}${labels}</svg>`;
  el.onmousemove = e => {
    const dot = e.target.closest(".dot"); if (!dot) return hideTip();
    const p = arr.find(q => q.nflId === +dot.dataset.id);
    showTip(e, `<b>${esc(p.name)}</b> <span class="m">${isWR ? "WR" : "CB"} · ${esc(p.team)}</span><br>${esc(t("arch")[p.archetype])}${p.tier === "limited" ? " · " + t("limited") : ""}
      <br><span class="m">${t("burst")}:</span> ${p.pct_burst}${ord(p.pct_burst)} pct · <span class="m">${t("burn")}:</span> ${p.pct_burn}${ord(p.pct_burn)} pct
      ${p.forty ? `<br><span class="m">${t("forty")}:</span> ${num(p.forty, 2)} s` : ""}<br><span class="m">${p.n_cut} ${t("cuts")} · ${p.n_vert} ${t("verts")} · ${t("click_load")}</span>`);
  };
  el.onmouseleave = hideTip;
  el.onclick = e => { const dot = e.target.closest(".dot"); if (!dot) return; hideTip(); if (isWR) openLab(+dot.dataset.id, state.cb); else openLab(state.wr, +dot.dataset.id); };
}
function renderScatters() { scatter($("scWR"), WR, state.wr, true); scatter($("scCB"), CB, state.cb, false); }

// ======================= Proof =======================
function renderProof() {
  const V = D.validation, f = (fam, won) => V.by_won.find(r => r.family === fam && r.won === won);
  const cw = f("cut", true), cl = f("cut", false), vw = f("vertical", true), vl = f("vertical", false), bins = V.by_sep;
  const pv = p => p < 0.001 ? "p < 0.001" : "p = " + num(p, p < 0.01 ? 3 : 2);
  $("tiles").innerHTML = `
    <div class="card tile"><div class="big" style="color:var(--cut)">${pct(cw.completion)} <small>vs ${pct(cl.completion)}</small></div><div class="cap">${t("t1")}</div>
      <div class="foot">${t("split_med_b")} · n = ${cw.n + cl.n} ${t("targets")} · ${pv(cw.p_value)}</div></div>
    <div class="card tile"><div class="big" style="color:var(--go)">${pct(vw.completion)} <small>vs ${pct(vl.completion)}</small></div><div class="cap">${t("t2")}</div>
      <div class="foot">${t("split_med_n")} · n = ${vw.n + vl.n} ${t("targets")} · ${pv(vw.p_value)} ${vw.p_value > 0.05 ? t("not_sig") : ""}</div></div>
    <div class="card tile"><div class="big">${pct(bins[0].mean)} <small>→ ${pct(bins[bins.length - 1].mean)}</small></div><div class="cap">${t("t3")}</div>
      <div class="foot">${t("t3_foot", { n: bins.reduce((a, b) => a + b.size, 0) })}</div></div>`;
  const W = 520, H = 220, pad = { l: 40, r: 10, t: 16, b: 34 }, bw = (W - pad.l - pad.r) / bins.length, Y = v => pad.t + (1 - v / 0.8) * (H - pad.t - pad.b);
  let g = "";
  [0, 0.2, 0.4, 0.6, 0.8].forEach(v => g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--ink-3)">${Math.round(v * 100)}%</text>`);
  bins.forEach((b, i) => {
    const x = pad.l + i * bw + bw * 0.2, w = bw * 0.6, y = Y(b.mean);
    g += `<path d="M${x},${Y(0)} V${y + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${Y(0)} Z" fill="var(--ink)" fill-opacity="${0.35 + 0.18 * i}"><title>${b.bin}: ${pct(b.mean)} (n=${b.size})</title></path>
      <text x="${x + w / 2}" y="${y - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${pct(b.mean)}</text>
      <text x="${x + w / 2}" y="${H - pad.b + 15}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${esc(b.bin)}</text>
      <text x="${x + w / 2}" y="${H - pad.b + 28}" text-anchor="middle" font-size="10" fill="var(--ink-3)">n=${b.size}</text>`;
  });
  $("sepChart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("sep_title"))}">${g}</svg>`;
  const r2 = m => num(FIT[m].oos_r2 * 100, 1);
  $("modelStats").innerHTML = `<div class="expect">
      <div class="stat"><div class="k">Burst</div><div class="v" style="color:var(--cut)">+${r2("burst")} %</div><div class="s">${t("oos")} · ${FIT.burst.n} cuts · λ=${FIT.burst.lambda}</div></div>
      <div class="stat"><div class="k">Burn</div><div class="v" style="color:var(--go)">+${r2("burn")} %</div><div class="s">${t("oos")} · ${FIT.burn.n} ${t("verts")} · λ=${FIT.burn.lambda}</div></div></div>
    <p style="margin-top:12px;color:var(--ink-2);font-size:13.5px">${t("skill_txt")}</p>`;
}

// ======================= Tooltip, i18n, theme, routing =======================
const tip = $("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }
const isDark = () => { const th = document.documentElement.dataset.theme; return th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  $("methodList").innerHTML = t("method").map(li => `<li>${li.replace("{b}", B)}</li>`).join("");
  $("tgLang").innerHTML = LANG === "fr" ? "<b>FR</b> <span>/ EN</span>" : "<b>EN</b> <span>/ FR</span>";
  $("tgTheme").textContent = isDark() ? "☾ " + t("theme_dark") : "☀ " + t("theme_light");
}
$("tgLang").addEventListener("click", () => { LANG = LANG === "fr" ? "en" : "fr"; store.set("mm-lang", LANG); renderAll(); });
$("tgTheme").addEventListener("click", () => { const next = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("mm-theme", next); renderAll(); });
function route() {
  const page = (location.hash || "#home").slice(1);
  const valid = ["home", "lab", "plan", "landscape", "proof", "method"].includes(page) ? page : "home";
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "page-" + valid));
  document.querySelectorAll("nav.pages a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + valid));
  document.body.classList.toggle("is-event", valid === "home");
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
function renderAll() {
  applyStatic(); renderSituation(); fillPlayers(); fillTeams();
  renderHome(); renderLab(); renderPlan(); renderScatters(); renderProof();
}
// Ouverture : duel Saints–Steelers (prix du hackathon : le match de Paris 2026)
state.wr = (WR.find(p => p.name === "Marquez Callaway") || WR[0]).nflId;
state.cb = (CB.find(p => p.name === "Joe Haden") || CB[0]).nflId;
renderAll(); route();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
</script>
